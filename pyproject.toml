[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-data-analysis-copilot"
version = "0.1.0"
description = "CSV loading and statistical tools for a future LLM analysis copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

llm = [
    "openai>=1.60,<3",
    "python-dotenv>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_cache/tmp"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
